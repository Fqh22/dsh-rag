name: publish

# 打 tag 时把 plugin/ 发到 npm。需要仓库 secret: NPM_TOKEN
# （npmjs.com → Access Tokens → Generate New Token → Automation）
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: check tag matches plugin version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./plugin/package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag 与 plugin/package.json 版本不一致"; exit 1; }

      - name: publish to npm
        working-directory: plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
