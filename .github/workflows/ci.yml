name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install deps
        run: pip install -r requirements.txt

      - name: import boundaries
        run: python scripts/check_imports.py

      - name: selftests (offline, temp db)
        run: |
          python scripts/selftest_contracts.py
          python scripts/selftest_session_source.py
          python scripts/selftest_pack.py
          python scripts/selftest_v5.py
          python scripts/selftest_v6.py
          python scripts/selftest_store.py
          python scripts/selftest_archive.py
          python scripts/selftest_projects.py
          python scripts/selftest_mcp.py

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 插件的 /api/state 会 spawn `python3 src/cli.py`，所以这里也要有 Python 依赖
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: plugin static selftest
        run: node scripts/selftest_plugin.mjs
